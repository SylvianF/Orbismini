# Tests du serveur d'Orbismini (dossier tests/) à chaque envoi sur main et sur les autres branches.
# Render ne met en ligne une version de main qu'une fois ce contrôle réussi (réglage de Render :
# Auto-Deploy « After CI Checks Pass »).
name: Tests du serveur
on:
  push:
    branches-ignore: [alertes, orbiscan-pc, captures-iphone]
    paths-ignore: ["ios/**", ".github/workflows/ios*.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliothèques (notifications de l'application iPhone)
        run: pip install -r requirements.txt
      - name: Tests
        run: |
          ok=0
          python -m unittest discover -s tests > tests.log 2>&1 || ok=$?
          tail -5 tests.log
          # Échecs en annotations (lisibles sans connexion) : le test, puis la ligne de l'erreur.
          if [ "$ok" -ne 0 ]; then
            grep -E "^(FAIL|ERROR): " tests.log | sort -u | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "^[A-Za-z_.]*(Error|Exception|Failure)[:( ]" tests.log | sort -u | head -30 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-900)"
            done
          fi
          exit $ok
