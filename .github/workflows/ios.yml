# Application iPhone (dossier ios/) : projet fabriqué par XcodeGen, compilation, tests, puis
# captures d’écran du simulateur (données d’exemple), publiées en artefacts de la tâche.
# Aucun secret : rien n’est signé ici (simulateur seulement).
name: Application iPhone
on:
  push:
    branches-ignore: [main, alertes, orbiscan-pc]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Simulateur
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] \
                  or [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulateur : $UDID"
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Compilation et tests
        run: |
          mkdir -p build
          ok=0
          xcodebuild test \
            -project Orbismini.xcodeproj -scheme Orbismini \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1 || ok=$?
          grep -E "error:|warning: .*/ios/|Test Case .*(passed|failed)|Executed|[*][*] (BUILD|TEST)" build/xcodebuild.log | tail -400 || true
          # Erreurs en annotations (lisibles sans connexion par l’API publique de GitHub).
          if [ "$ok" -ne 0 ]; then
            grep -E "(error:|: error |failed \()" build/xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
              short=$(printf '%s' "$line" | sed -E 's#^.*/ios/##' | cut -c1-900)
              echo "::error::$short"
            done
            [ -n "$(grep -E "(error:|: error |failed \()" build/xcodebuild.log | head -1)" ] || tail -30 build/xcodebuild.log | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-900)"; done
          fi
          exit $ok
      - name: Captures d’écran
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/Orbismini.app
          mkdir -p ../captures
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          for screen in cours meteo alerte widget reglages connexion rachat; do
            xcrun simctl terminate "$UDID" fr.cndo.orbismini 2>/dev/null || true
            xcrun simctl launch "$UDID" fr.cndo.orbismini -demo -ecran "$screen"
            # Pages web (Rachat) : le serveur Render peut mettre une minute à se réveiller.
            if [ "$screen" = rachat ]; then sleep 45; else sleep 6; fi
            xcrun simctl io "$UDID" screenshot "../captures/$screen.png"
          done
          ls -la ../captures
      - name: Captures (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-iphone
          path: captures/
          if-no-files-found: ignore
      - name: Journal de compilation (artefact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: |
            ios/build/xcodebuild.log
            ios/build/Tests.xcresult
          if-no-files-found: ignore
