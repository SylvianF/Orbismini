services:
  - type: web
    name: mon-cours-or
    runtime: python
    plan: free
    # Dépendances des notifications de l’application iPhone (apns.py) ; sans elles, tout le reste marche.
    buildCommand: "pip install -r requirements.txt || echo Ready"
    startCommand: "python server.py"
    # Fichier lisible sans mot de passe : Render vérifie ainsi que le service répond.
    healthCheckPath: /icon.svg
    envVars:
      # Mot de passe à l’ouverture, à saisir dans Render (jamais dans le dépôt).
      - key: GOLDAPP_PASSWORD
        sync: false
      # Clé du widget iPhone (Scriptable) : lecture seule des cours.
      - key: GOLDAPP_WIDGET_KEY
        sync: false
      # Scanner de pièces (onglet Scan) : clé Anthropic (Claude) et clé Numista (catalogue).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NUMISTA_API_KEY
        sync: false
      # Orbiscan par Orbismini : clé GitHub limitée à ce dépôt (Contents : lecture et écriture),
      # pour retenir chaque PC (branche orbiscan-pc) ; code de Sylvian pour remettre un PC à zéro.
      - key: ORBISCAN_GITHUB_TOKEN
        sync: false
      - key: ORBISCAN_ADMIN
        sync: false
      # Notifications de l’application iPhone (apns.py) : éteintes tant que ORBISMINI_APNS ne vaut pas 1.
      # APNS_KEY : contenu du fichier .p8 d’Apple ; APNS_KEY_ID, APNS_TEAM_ID : 10 caractères chacun ;
      # APNS_TOPIC : identifiant de l’application (fr.cndo.orbismini).
      - key: ORBISMINI_APNS
        sync: false
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_TOPIC
        sync: false
