# Application iPhone d’Orbismini, décrite pour XcodeGen (le projet Xcode est fabriqué à partir
# de ce fichier sur GitHub Actions : « xcodegen generate » ; aucun .xcodeproj dans le dépôt).
#
# Identifiants : application fr.cndo.orbismini, widget fr.cndo.orbismini.widget,
# groupe partagé group.fr.cndo.orbismini (données et session partagées avec le widget).
# L’équipe Apple (DEVELOPMENT_TEAM) est donnée à la compilation, jamais écrite ici.
name: Orbismini
options:
  bundleIdPrefix: fr.cndo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Orbismini:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orbismini
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: fr.cndo.orbismini
            CFBundleURLSchemes:
              - orbismini
        NSCameraUsageDescription: Orbiscan, pièce inconnue et ticket de frais prennent une photo.
        NSPhotoLibraryUsageDescription: Choisir une photo déjà prise pour un scan ou un ticket.
        NSPhotoLibraryAddUsageDescription: Enregistrer une estimation ou un ticket dans les photos.
    entitlements:
      path: App/Orbismini.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.fr.cndo.orbismini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.cndo.orbismini
        PRODUCT_NAME: Orbismini
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: OrbisminiWidget
  OrbisminiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orbismini
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/OrbisminiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fr.cndo.orbismini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.cndo.orbismini.widget
        PRODUCT_NAME: OrbisminiWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  OrbisminiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Orbismini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.cndo.orbismini.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orbismini.app/Orbismini
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Orbismini:
    build:
      targets:
        Orbismini: all
        OrbisminiTests: [test]
    test:
      targets:
        - OrbisminiTests
      gatherCoverageData: false
    archive:
      config: Release
